<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consola SQL · videojuegos</title>
  <style>
    :root {
      --bg: #eef3f8;
      --paper: #ffffff;
      --ink: #1c2834;
      --muted: #4d6073;
      --line: #d3deea;
      --accent: #1565c0;
      --accent-ink: #ffffff;
      --chip: #f4f8fc;
      --chip-on: #e3f0ff;
      --chip-line: #b9d2ee;
      --note-bg: #fff8e8;
      --note-ink: #6b4e12;
      --null: #9a6700;
      --danger-bg: #fff1f0;
      --danger: #9b1c1c;
      --ok: #0d6b45;
      --head: #e7f0fa;
      --zebra: #f6f9fc;
      --shadow: 0 1px 2px rgba(28, 40, 52, 0.06), 0 8px 24px rgba(28, 40, 52, 0.05);
    }

    * { box-sizing: border-box; }

    html {
      font-size: clamp(18px, 1.65vw, 24px);
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--ink);
      background: var(--bg);
      font-family: "Segoe UI", "Liberation Sans", "Helvetica Neue", sans-serif;
      line-height: 1.35;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      padding: 0.75rem 1.25rem 0.35rem;
    }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .sub a { color: var(--accent); }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 0.55rem;
    }

    #reset, #toggle-ejemplos {
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--line);
      padding: 0.45rem 0.9rem;
      white-space: nowrap;
    }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    #reset:hover, #toggle-ejemplos:hover { border-color: var(--accent); color: var(--accent); }

    #toggle-ejemplos[aria-expanded="true"] {
      border-color: var(--accent);
      background: var(--chip-on);
      color: var(--accent);
      font-weight: 700;
    }

    #examples {
      padding: 0 1.25rem 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    #examples[hidden] { display: none; }

    .grupo {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
    }

    .grupo-nombre {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      min-width: 7.2rem;
    }

    .chip {
      background: var(--chip);
      color: var(--ink);
      border: 2px solid var(--line);
      padding: 0.32rem 0.7rem;
      font-size: 0.92rem;
    }

    .chip:hover { border-color: var(--chip-line); background: var(--chip-on); }

    .chip[aria-pressed="true"] {
      background: var(--chip-on);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 0.9rem;
      padding: 0 1.25rem 1rem;
    }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      box-shadow: var(--shadow);
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .panel-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.55rem 0.8rem;
      border-bottom: 1px solid var(--line);
    }

    .panel-bar h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }

    textarea {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      margin: 0;
      padding: 0.8rem 0.9rem;
      background: #fffdf8;
      color: var(--ink);
      font-family: "Liberation Mono", "Cascadia Mono", "Courier New", monospace;
      font-size: 1.12rem;
      line-height: 1.45;
    }

    textarea:focus { outline: none; }

    .note {
      margin: 0 0.8rem;
      padding: 0.45rem 0.7rem;
      background: var(--note-bg);
      color: var(--note-ink);
      border-radius: 0.45rem;
      font-size: 0.86rem;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.65rem 0.8rem 0.75rem;
    }

    #run {
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      padding: 0.5rem 1.15rem;
      font-weight: 700;
      font-size: 1.05rem;
    }

    #run:hover { filter: brightness(1.08); }

    #hint { color: var(--muted); font-size: 0.82rem; }

    #results {
      overflow: auto;
      padding: 0.7rem 0.8rem 0.9rem;
    }

    .vacio, .error, .ok {
      margin: 0.4rem 0;
      font-size: 1.05rem;
    }

    .error {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 0.7rem 0.8rem;
      border-radius: 0.5rem;
      white-space: pre-wrap;
    }

    .ok { color: var(--ok); font-weight: 700; }

    .resultado + .resultado { margin-top: 1.1rem; }

    .meta {
      margin: 0 0 0.4rem;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.02rem;
    }

    th, td {
      text-align: left;
      padding: 0.38rem 0.65rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      background: var(--head);
      font-size: 0.92rem;
    }

    tbody tr:nth-child(even) { background: var(--zebra); }

    td.num { text-align: right; font-variant-numeric: tabular-nums; }

    .null {
      color: var(--null);
      font-weight: 700;
      font-size: 0.86em;
      letter-spacing: 0.04em;
    }

    @media (max-width: 960px) {
      body { height: auto; overflow: auto; }
      .header-actions { width: 100%; }
      .workspace { grid-template-columns: 1fr; }
      textarea { min-height: 14rem; }
      #results { max-height: 70vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Consola SQL · videojuegos</h1>
      <p class="sub">Dataset de la clase ya cargado. Las consultas de <a href="/slides/sql-2/index.html">JOINs &amp; GROUP BY</a> están en Ejemplos.</p>
    </div>
    <div class="header-actions">
      <button id="toggle-ejemplos" type="button" aria-expanded="false" aria-controls="examples">Ejemplos</button>
      <button id="reset" type="button">Recargar datos</button>
    </div>
  </header>
  <div id="examples" hidden></div>
  <div class="workspace">
    <section class="panel" aria-label="Consulta">
      <div class="panel-bar"><h2>Consulta</h2></div>
      <textarea id="sql" spellcheck="false" aria-label="Consulta SQL"></textarea>
      <p class="note" id="note" hidden></p>
      <div class="actions">
        <button id="run" type="button">Ejecutar</button>
        <span id="hint">Ctrl + Enter</span>
      </div>
    </section>
    <section class="panel" aria-label="Resultado">
      <div class="panel-bar"><h2>Resultado</h2></div>
      <div id="results"><p class="vacio">Cargando SQLite y el dataset…</p></div>
    </section>
  </div>
  <script src="vendor/sql-wasm.js"></script>
  <script>
    const sqlInput = document.getElementById("sql");
    const results = document.getElementById("results");
    const note = document.getElementById("note");
    const examplesEl = document.getElementById("examples");

    let db = null;
    let datasetSql = "";
    let activo = null;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function paraSqlite(sql) {
      return sql.replaceAll("SERIAL PRIMARY KEY", "INTEGER PRIMARY KEY");
    }

    function cargarDatos() {
      if (db) db.close();
      db = new SQL.Database();
      db.exec("PRAGMA foreign_keys = ON;\n" + paraSqlite(datasetSql));
    }

    function esNumero(value) {
      return typeof value === "number" || (typeof value === "string" && value !== "" && !Number.isNaN(Number(value)));
    }

    function pintarCelda(value, numerica) {
      if (value === null) return '<td><span class="null">NULL</span></td>';
      const clase = numerica ? ' class="num"' : "";
      return "<td" + clase + ">" + escapeHtml(value) + "</td>";
    }

    function pintarTabla(resultado) {
      const columnas = resultado.columns;
      const filas = resultado.values;
      const numericas = columnas.map((_, i) => filas.every((fila) => fila[i] === null || esNumero(fila[i])));
      const encabezado = columnas.map((col) => "<th>" + escapeHtml(col) + "</th>").join("");
      const cuerpo = filas.map((fila) => {
        const celdas = fila.map((valor, i) => pintarCelda(valor, numericas[i])).join("");
        return "<tr>" + celdas + "</tr>";
      }).join("");
      const cuantas = filas.length === 1 ? "1 fila" : filas.length + " filas";
      return '<div class="resultado"><p class="meta">' + cuantas + "</p><table><thead><tr>" + encabezado + "</tr></thead><tbody>" + cuerpo + "</tbody></table></div>";
    }

    function ejecutar() {
      if (!db) return;
      const consulta = sqlInput.value.trim();
      if (!consulta) {
        results.innerHTML = '<p class="vacio">Escribí una consulta o elegí un ejemplo.</p>';
        return;
      }
      const inicio = performance.now();
      try {
        const salidas = db.exec(consulta);
        const ms = Math.max(1, Math.round(performance.now() - inicio));
        if (salidas.length === 0) {
          const n = db.getRowsModified();
          results.innerHTML = '<p class="ok">Listo. Filas modificadas: ' + n + " · " + ms + " ms</p>";
          return;
        }
        results.innerHTML = salidas.map(pintarTabla).join("") + '<p class="meta">' + ms + " ms</p>";
      } catch (error) {
        results.innerHTML = '<p class="error">' + escapeHtml(error.message) + "</p>";
      }
    }

    function elegir(item, boton) {
      document.querySelectorAll(".chip").forEach((chip) => chip.setAttribute("aria-pressed", "false"));
      boton.setAttribute("aria-pressed", "true");
      activo = item.id;
      sqlInput.value = item.sql;
      if (item.nota) {
        note.hidden = false;
        note.textContent = item.nota;
      } else {
        note.hidden = true;
        note.textContent = "";
      }
      ejecutar();
    }

    function armarBotones(grupos) {
      examplesEl.replaceChildren();
      for (const grupo of grupos) {
        const fila = document.createElement("div");
        fila.className = "grupo";
        const nombre = document.createElement("span");
        nombre.className = "grupo-nombre";
        nombre.textContent = grupo.grupo;
        fila.append(nombre);
        for (const item of grupo.items) {
          const boton = document.createElement("button");
          boton.type = "button";
          boton.className = "chip";
          boton.textContent = item.label;
          boton.setAttribute("aria-pressed", "false");
          boton.addEventListener("click", () => elegir(item, boton));
          fila.append(boton);
        }
        examplesEl.append(fila);
      }
    }

    document.getElementById("toggle-ejemplos").addEventListener("click", () => {
      const abierto = examplesEl.hidden;
      examplesEl.hidden = !abierto;
      const boton = document.getElementById("toggle-ejemplos");
      boton.setAttribute("aria-expanded", String(abierto));
      boton.textContent = abierto ? "Ocultar ejemplos" : "Ejemplos";
    });
    document.getElementById("run").addEventListener("click", ejecutar);
    document.getElementById("reset").addEventListener("click", () => {
      try {
        cargarDatos();
        ejecutar();
      } catch (error) {
        results.innerHTML = '<p class="error">' + escapeHtml(error.message) + "</p>";
      }
    });
    sqlInput.addEventListener("input", () => {
      note.hidden = true;
      document.querySelectorAll(".chip").forEach((chip) => chip.setAttribute("aria-pressed", "false"));
    });
    sqlInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        ejecutar();
      }
    });

    Promise.all([
      initSqlJs({ locateFile: (archivo) => "vendor/" + archivo }),
      fetch("dataset.sql").then((respuesta) => {
        if (!respuesta.ok) throw new Error("No se pudo leer dataset.sql");
        return respuesta.text();
      }),
      fetch("ejemplos.json").then((respuesta) => {
        if (!respuesta.ok) throw new Error("No se pudo leer ejemplos.json");
        return respuesta.json();
      })
    ]).then(([SQLLib, dataset, grupos]) => {
      window.SQL = SQLLib;
      datasetSql = dataset;
      armarBotones(grupos);
      cargarDatos();
      results.innerHTML = '<p class="vacio">Escribí una consulta o abrí Ejemplos.</p>';
    }).catch((error) => {
      results.innerHTML = '<p class="error">' + escapeHtml(error.message || error) + "</p>";
    });
  </script>
</body>
</html>
